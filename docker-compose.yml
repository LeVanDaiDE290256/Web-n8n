version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: logchat_web_n8n
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - logchat_postgres_data:/var/lib/postgresql/data

volumes:
  logchat_postgres_data: